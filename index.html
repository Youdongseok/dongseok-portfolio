    href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Poppins:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <script>
    (() => {
      let saved = null
      try { saved = localStorage.getItem('theme') } catch (e) { }
      const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : systemTheme
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
